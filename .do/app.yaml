# DigitalOcean App Platform spec for the long-running OPS Disponent API.
# Create once:   doctl apps create --spec .do/app.yaml
# Update later:  doctl apps update <app-id> --spec .do/app.yaml
#
# Secrets (type: SECRET) have no value here on purpose. Enter them in the
# DigitalOcean control panel: App → Settings → api → Environment Variables.
name: ops-disponent-api
region: fra

databases:
  # Attaching the cluster lets App Platform inject credentials, so no database
  # password is copied by hand. The app runs as the limited role ops_runtime;
  # only the pre-deploy migration uses doadmin.
  - name: opsdb
    engine: PG
    production: true
    cluster_name: ops-disponent-prod
    db_name: defaultdb
    db_user: ops_runtime
  - name: opsadmin
    engine: PG
    production: true
    cluster_name: ops-disponent-prod
    db_name: defaultdb
    db_user: doadmin

services:
  - name: api
    github:
      repo: QLord-ops/Forex-OPS
      branch: main
      # Every merge into main deploys automatically (owner decision 2026-11-01).
      # The PRE_DEPLOY migration runs first; DigitalOcean keeps 7 days of point-in-time backups.
      deploy_on_push: true
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    http_port: 3001
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
      initial_delay_seconds: 20
    envs:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${opsdb.DATABASE_URL}
      - key: ALLOWED_ORIGINS
        value: https://ops-disponent-web.vercel.app
      - key: DISPATCHER_ALLOWED_ORIGINS
        value: https://ops-disponent-web.vercel.app
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_PASSWORD_HASH
        scope: RUN_TIME
        type: SECRET
      - key: DISPATCHER_PASSWORD_HASH
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: TOMTOM_API_KEY
        scope: RUN_TIME
        type: SECRET
      # Routing with live traffic stays off until the free tier is confirmed.
      - key: TOMTOM_FREE_TIER_CONFIRMED
        value: "true"
      - key: TOMTOM_ROUTING_MONTHLY_CAP
        value: "18000"
      - key: TOMTOM_MANUAL_RESERVE_RATIO
        value: "0.2"
      - key: WEBFLEET_ACCOUNT
        scope: RUN_TIME
        type: SECRET
      - key: WEBFLEET_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: WEBFLEET_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: WEBFLEET_PASSWORD
        scope: RUN_TIME
        type: SECRET

jobs:
  # Runs once before each deploy, never in parallel from several API instances.
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: QLord-ops/Forex-OPS
      branch: main
      deploy_on_push: true
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: npm run db:deploy --workspace @ops/api
    envs:
      - key: DATABASE_URL_UNPOOLED
        scope: RUN_TIME
        value: ${opsadmin.DATABASE_URL}
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${opsdb.DATABASE_URL}
