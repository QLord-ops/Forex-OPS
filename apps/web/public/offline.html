<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13295b" />
    <title>Нет связи · OPS FOREX</title>
    <style>
      :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f1f5f9; color: #0f172a; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { margin: 20px 0 8px; font-size: 1.25rem; font-weight: 600; }
      p { margin: 0 0 24px; color: #475569; line-height: 1.5; }
      a { display: inline-flex; min-height: 44px; align-items: center; border-radius: 10px; background: #1d4ed8; padding: 0 20px; color: #ffffff; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 3px; }
      @media (prefers-color-scheme: dark) {
        body { background: #08101b; color: #e8edf5; }
        p { color: #94a3b8; }
        a { background: #ece6d8; color: #0f172a; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Нет связи</h1>
      <p>OPS FOREX покажет машины, когда интернет вернётся. Устаревшие данные не показываются.</p>
      <a href="/">Повторить</a>
    </main>
  </body>
</html>
